# docs/ is committed build output (see README, "Deployment"). CI verifies the
# sources and publishes the committed files; it is not where the bundle is built.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: node:22
  interruptible: true

stages:
  - check
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.node:
  before_script:
    - npm config set //npm.pkg.github.com/:_authToken "$NPM_TOKEN"
    - npm ci --cache .npm --prefer-offline

typecheck:
  extends: .node
  stage: check
  script:
    - npm run typecheck

lint:
  extends: .node
  stage: check
  script:
    - npm run format:check
    - npm run lint
    - npm run check:comments

# Advisory: catches "changed src/, forgot to rebuild docs/".
# allow_failure so a non-deterministic esbuild output can never block an MR.
bundle-in-sync:
  extends: .node
  stage: check
  allow_failure: true
  script:
    - npm run build
    - git diff --exit-code -- docs/ || { echo "docs/ is stale, run 'npm run build' and commit the result."; exit 1; }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The pin must be a Dataset release tag, not a moving branch tip.
dataset-pin:
  stage: check
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - git -C vendor/dataset fetch --tags --quiet
    - git -C vendor/dataset describe --tags --exact-match
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Pages job. Not named `pages` (that job name is deprecated), no `artifacts:`
# block (pages.publish is appended to artifacts:paths automatically), no copy
# step (docs/ is already the publish directory).
deploy-pages:
  stage: deploy
  interruptible: false
  script:
    - echo "docs/ is committed build output; nothing to build."
  pages:
    publish: docs
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
