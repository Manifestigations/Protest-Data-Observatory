name: style

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: npm
    - run: npm ci
    - run: npm run typecheck
    - run: npm run format:check
    - run: npm run lint
    - run: npm run check:comments
    - run: npm run check:baseline
    - run: node scripts/build.ts
    - run: npm run check:size
    - run: npx playwright install --with-deps chromium
    - run: npm run check:a11y
