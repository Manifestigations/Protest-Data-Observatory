<!doctype html>
<html lang="fr" data-lang="fr" data-page="home">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1115"
    />
    <script>
      try {
        const t = localStorage.getItem("fpc-theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <title>Activité contestataire — octobre–novembre 2026</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="bundle.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="hdr.skip">Aller au contenu</a>

    <header class="page-head">
      <a
        class="cta-help"
        href="contribute.html"
        data-page-link="contribute"
        data-i18n="hdr.cta"
      ></a>
      <h1 data-i18n="hdr.title"></h1>
      <p class="lede" data-i18n="hdr.lede"></p>
      <div class="head-tools">
        <div
          class="lang-switch"
          data-lang-switch
          role="group"
          aria-label="Langue"
        >
          <button type="button" data-set-lang="fr">FR</button>
          <button type="button" data-set-lang="en">EN</button>
        </div>
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-pressed="false"
          data-i18n="ui.theme"
          data-i18n-attr="aria-label"
          aria-label="Mode sombre"
        >
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            ></path>
          </svg>
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
          </svg>
        </button>
        <a
          class="repo-link"
          id="repo-link"
          href="https://github.com/Manifestigations/Protest-Data-Observatory"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Code source sur GitHub"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
        </a>
      </div>
    </header>

    <div id="disclaimer" class="disclaimer" role="note"></div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>

    <main id="main" tabindex="-1">
      <nav id="crumbs" class="crumbs"></nav>

      <section id="about" class="about"></section>

      <section class="hub" aria-labelledby="hdr-page">
        <header id="hdr-page"></header>
        <div id="card-grid"></div>
      </section>

      <section id="sources" aria-labelledby="sources-title">
        <h2 class="sources-title" id="sources-title">Sources</h2>
      </section>
    </main>

    <noscript>
      <p>
        Ces graphiques nécessitent JavaScript. Les chiffres sources sont listés
        ci-dessous dans la section « Sources ».
      </p>
      <p lang="en">
        These charts require JavaScript. The source figures are listed below in
        the “Sources” section.
      </p>
    </noscript>
  </body>
</html>
